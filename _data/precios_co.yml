# Carrier prepaid prices for /es/precios/ and /prices/colombia/. One row per pack. Same shape as precos_br.yml.
# size: large = the pack you buy to cover the month; small = 1 to 7 day packs.
# pending: true = price from a comparison site (Selectra, July 2026), not yet verified on the carrier's page; rendered with a dagger.
# label: optional short text for the direct label on the scatter chart.
# COP/GB is computed in the page (price * 1024 / mb). Evidence screenshots: assets/precios-co/.
checked: 2026-09-23
# One entry per carrier page read. `shot` is the screenshot in assets/precios-co/.
sources:
  - carrier: Claro
    page: Paquetes Claro Prepago (Todo incluido WIN)
    url: https://www.claro.com.co/personas/servicios/servicios-moviles/prepago/
    shot: 2026-09-23-claro-prepago.jpg
  - carrier: Claro
    page: Planes y precios, filtro prepago (paquetes de 1 a 7 días)
    url: https://www.claro.com.co/personas/servicios/servicios-moviles/planes-y-precios/?filterHead=38&filterType=79
    shot: 2026-09-23-claro-planes-y-precios-prepago.jpg
