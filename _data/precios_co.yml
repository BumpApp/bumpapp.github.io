# Carrier prepaid prices for /es/precios/ and /prices/colombia/. One row per pack. Same shape as precos_br.yml.
# size: large = the pack you buy to cover the month; small = 1 to 7 day packs.
# label: optional short text for the direct label on the scatter chart.
# COP/GB is computed in the page (price * 1024 / mb). Evidence screenshots: assets/precios-co/.
checked: 2026-09-23
# One entry per carrier page read. `shot` is the screenshot in assets/precios-co/.
sources:
