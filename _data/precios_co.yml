    shot: 2026-09-23-movistar-paquetes-prepago.jpg
  # Rows marked pending come from Grant's July 2026 spreadsheet, sourced from Selectra (a comparison site).
  # They stay marked until an in-country screenshot of the carrier's own page replaces the source.
  - carrier: WOM
