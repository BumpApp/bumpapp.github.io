---
layout: default
---
<main class="bg-surface">
  <article class="mx-auto max-w-3xl px-4 sm:px-6 py-16 prose prose-lg prose-slate">
    <h1>{{ page.title }}</h1>
    {%- if page.date %}
    <p class="text-sm text-gray-500"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
    {%- endif %}
    {{ content }}
  </article>
</main>
