<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: #0F172A; }
    .hero {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background: #0F172A;
    }
  </style>
</head>
<body>

  <div class="hero">
    <img src="../bg@2x.png" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;">

    <div style="position:absolute;top:24px;left:40px;z-index:20;">
      <img src="../bump-logo.svg" style="height:36px;">
    </div>

    <img src="../phone-connected@2x.png" style="position:absolute;right:120px;bottom:-30px;height:420px;filter:drop-shadow(0 20px 40px rgba(0,0,0,0.4));z-index:10;">
  </div>

</body>
</html>
